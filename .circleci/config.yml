version: 2.1

jobs:
  build:
    machine: true
    resource_class: arm.medium
    steps:
      - checkout
      # The Node requirement lives in the repository (engines.node + .nvmrc).
      # Resolve it here, and refuse to build if the Dockerfile lost the Node
      # install block or its build-time guard.
      - run:
          name: Resolve the Node version required by engines.node
          command: |
            sh .fork/check-dockerfile.sh
            NODE_MAJOR=$(sh .fork/resolve-node-version.sh)
            echo "export NODE_MAJOR=$NODE_MAJOR" >> "$BASH_ENV"
            echo "Building with NODE_VERSION=$NODE_MAJOR (from engines.node)"
      - run: docker login -u "$DOCKER_LOGIN" -p "$DOCKER_PASSWORD"
      # The web bundling step peaks above the arm.medium runner's RAM: without
      # swap, `bun run build:web` is OOM-killed (exit 137) at the "rendering
      # chunks" phase, intermittently, on identical commits. Swap keeps the
      # build alive instead of turning it into a coin flip.
      - run:
          name: Add swap for the web build
          command: |
            sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
            free -h || true
      - run:
          name: Build the image
          command: |
            VERSION_TAG=$(echo "$CIRCLE_SHA1" | cut -c1-7)
            APP_VERSION=$(grep -m1 '"version"' package.json | sed 's/[^0-9.]//g')
            echo "export VERSION_TAG=$VERSION_TAG" >> "$BASH_ENV"
            echo "export APP_VERSION=$APP_VERSION" >> "$BASH_ENV"
            set -o pipefail
            DOCKER_BUILDKIT=1 docker build \
              --build-arg NODE_VERSION="$NODE_MAJOR" \
              -t sourabhjagga/openchamber-harden:latest \
              -t sourabhjagga/openchamber-harden:main \
              -t sourabhjagga/openchamber-harden:${VERSION_TAG} \
              -t sourabhjagga/openchamber-harden:v${APP_VERSION} \
              . 2>&1 | tee /tmp/oc-build.log
      # Verify the image that was actually produced, not just the Dockerfile:
      # if `node` in the image is below engines.node, this fails and nothing is
      # pushed or deployed. The same check runs inside `docker build`, so this
      # is the second net (PATH resolution, a stale layer, a wrong base image).
      - run:
          name: Verify the image ships Node >= engines.node
          command: |
            IMAGE="sourabhjagga/openchamber-harden:${VERSION_TAG}"
            docker run --rm --entrypoint node "$IMAGE" --version
            docker run --rm --entrypoint npm "$IMAGE" --version
            docker run --rm --entrypoint node \
              -v "$PWD/.fork:/node-check:ro" \
              "$IMAGE" /node-check/check-node-version.mjs
      - run:
          name: Push the image
          command: |
            docker push sourabhjagga/openchamber-harden:latest
            docker push sourabhjagga/openchamber-harden:main
            docker push sourabhjagga/openchamber-harden:${VERSION_TAG}
            docker push sourabhjagga/openchamber-harden:v${APP_VERSION}
      # Publish the build log even when the build failed, so the failure can
      # be read without opening CircleCI.
      - run:
          name: Publish the build log
          command: ./.fork/upload-build-log.sh
          when: always
      # Deploy the image that was just pushed. The host runs this over SSH
      # with a key that can do nothing else, and the host script rolls back to
      # the last good commit if the deployment fails. The job therefore fails
      # when the deployment failed, even though the image was pushed.
      - run: ./.fork/ci-trigger-deploy.sh

workflows:
  build:
    jobs:
      - build:
          filters:
            branches:
              only: main
