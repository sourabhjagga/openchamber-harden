name: Upstream Sync (Nightly Maintenance)

on:
  schedule:
    # 21:30 UTC = 03:00 AM IST every night
    - cron: "30 19 * * 4"  # Thursdays 19:30 UTC = Fridays 01:00 IST (within 1-3 AM window)
  workflow_dispatch:
    inputs:
      force:
        description: 'Force sync even if the latest eligible release is < 48h old'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Configure Git Author
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check Upstream Releases
        id: check_release
        run: |
          git remote add upstream https://github.com/openchamber/openchamber.git || true
          git fetch upstream --tags

          # Pick the newest upstream v* tag that is at least ${SOAK_HOURS}h old
          # (sorted newest first). A brand-new release (< soak window) is skipped
          # in favour of the previous one, so a failed/half-baked latest tag
          # never blocks the fork. If every tag is still inside the window we
          # take the newest anyway so the fork can never get stuck.
          SOAK_HOURS="${SOAK_HOURS:-0}"
          NOW="$(date +%s)"
          LATEST_TAG=""
          while read -r T; do
            [ -z "$T" ] && continue
            T_DATE=$(git log -1 --format=%ct "$T" 2>/dev/null || echo 0)
            T_AGE=$(( NOW - T_DATE ))
            echo "candidate $T age=$((T_AGE/3600))h"
            if [ "$T_AGE" -ge $(( SOAK_HOURS * 3600 )) ]; then
              LATEST_TAG="$T"
              break
            fi
          done < <(git tag -l "v*" --sort=-creatordate)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="$(git tag -l "v*" --sort=-creatordate | head -n 1)"
          fi
          if [ -z "$LATEST_TAG" ]; then
            echo "No upstream tags found."
            exit 0
          fi
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

          # Check if tag is already merged
          if git merge-base --is-ancestor "$LATEST_TAG" HEAD; then
            echo "Fork is already up to date with $LATEST_TAG."
            echo "sync_needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found new upstream release: $LATEST_TAG"
          TAG_DATE="$(git log -1 --format=%ct "$LATEST_TAG")"
          NOW="$(date +%s)"
          AGE_HOURS=$(( (NOW - TAG_DATE) / 3600 ))
          echo "Tag age: ${AGE_HOURS}h"

          FORCE="${{ inputs.force }}"
          if [ "$FORCE" != "true" ] && [ "$AGE_HOURS" -lt 48 ]; then
            echo "Release $LATEST_TAG is ${AGE_HOURS}h old (< 48h minimum age). Waiting for stability."
            echo "sync_needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Release $LATEST_TAG is ready to be absorbed (${AGE_HOURS}h old, soak passed)."
          echo "sync_needed=true" >> "$GITHUB_OUTPUT"

      - name: Merge Upstream Release & Update Image Tag
        if: steps.check_release.outputs.sync_needed == 'true'
        run: |
          TAG="${{ steps.check_release.outputs.latest_tag }}"
          echo "Merging release $TAG..."

          if ! git merge --no-edit "$TAG" -m "sync: absorb upstream release $TAG"; then
            echo "Handling upstream workflow conflicts..."
            sh .fork/sync-upstream-workflows.sh

            # The fork owns the Dockerfile as a whole: it carries the Node
            # install block and its build guard, which Debian's apt nodejs
            # cannot provide. Keeping ours is intentional - taking upstream's
            # Dockerfile would drop that block. The Node *version* is not
            # hardcoded here; it is re-derived from engines.node below, so an
            # upstream requirement bump still reaches the image.
            if git status --porcelain | grep -q "^UU Dockerfile\|^AA Dockerfile"; then
              echo "Resolving Dockerfile merge conflict: keeping the fork Dockerfile (Node block + guard)"
              git checkout HEAD -- Dockerfile
              git add Dockerfile
            fi

            # Fail only if there are real code conflicts outside .github/workflows
            UNMERGED="$(git diff --name-only --diff-filter=U)"
            if [ -n "$UNMERGED" ]; then
              echo "Merge has real code conflicts outside workflows:"
              echo "$UNMERGED"
              exit 1
            fi

            git commit --no-edit -m "sync: absorb upstream release $TAG"
          else
            sh .fork/sync-upstream-workflows.sh
            if ! git diff --quiet .github/workflows scripts; then
              git add .github/workflows scripts
              git commit -m "chore(ci): reconcile upstream workflows"
            fi
          fi

          # Keep the Dockerfile default aligned with the merged tree's
          # engines.node (the image itself always gets the derived version from
          # CircleCI). Then prove the merge did not drop the Node block or its
          # guard: a sync that would ship a stale Node fails here, before the
          # push that triggers the image build and the deployment.
          sh .fork/reconcile-node-version.sh
          if ! git diff --quiet Dockerfile; then
            git add Dockerfile
            git commit -m "chore(docker): track Node requirement from engines.node"
          fi
          sh .fork/check-dockerfile.sh

          # Update the image tag in docker-compose.yaml to match the newly absorbed release
          if [ -f docker-compose.yaml ]; then
            sed -i "s|sourabhjagga/openchamber-harden:v[0-9.]*|sourabhjagga/openchamber-harden:${TAG}|g" docker-compose.yaml
            if ! git diff --quiet docker-compose.yaml; then
              git add docker-compose.yaml
              git commit -m "chore(deploy): pin image tag to ${TAG} in compose"
            fi
          fi

          echo "Pushing changes to main branch (triggers CircleCI deploy pipeline)..."
          if [ -n "${GH_PAT:-}" ]; then
            git push "https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git" main
          else
            git push origin main
          fi
