# One place to bump the release tag.
x-openchamber-image: &openchamber-image sourabhjagga/openchamber-harden:v2.5.2

services:
  openchamber:
    # Pinned to a specific version tag (set after each CircleCI build by retag).
    # Change to :v2.3.3, :v2.3.2, :v2.2.0 for explicit rollback — all
    # prior versions remain on DockerHub with their unique digests.
    image: *openchamber-image
    container_name: openchamber
    pull_policy: always
    # Chromium writes shared memory through /dev/shm, which Docker caps at 64MB
    # by default. Headless Chrome overruns that and dies on heavy pages, so the
    # Server Browser extension needs a bigger segment.
    shm_size: 1gb
    # One runaway browser session or agent turn must not take the host's memory
    # and process table with it. The app idles near 1.3GB, so 6GB leaves room
    # for Chromium plus a build and still leaves the host headroom.
    mem_limit: 6g
    pids_limit: 4096
    # The app logs every request; without rotation the json-file log grows for
    # the life of the container.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    # Chromium's own sandbox needs to create an unprivileged user namespace.
    # Docker's default seccomp profile blocks that call, which leaves the
    # browser with no sandbox of its own and the container as the only
    # boundary. Letting the namespace through lets the browser keep its
    # sandbox, so a hostile page is held inside the browser instead of only
    # inside the container.
    #
    # The container still runs with no capabilities and in its own namespaces.
    # The wrapper in the image falls back to running the browser without a
    # sandbox when the namespace is not available, so removing this line
    # leaves the browser working, just less contained.
    security_opt:
      - seccomp=unconfined
    ports:
      - "3005:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - openchamber-config:/home/openchamber/.config/openchamber
      - openchamber-opencode-share:/home/openchamber/.local/share/opencode
      - openchamber-opencode-state:/home/openchamber/.local/state/opencode
      - openchamber-opencode-config:/home/openchamber/.config/opencode
      - openchamber-ssh:/home/openchamber/.ssh
      - openchamber-workspaces:/home/openchamber/workspaces
      # Persist opencode plugin cache + npx MCP cache so redeploys don't force
      # fresh registry downloads that stall startup for minutes.
      - openchamber-opencode-cache:/home/openchamber/.cache/opencode
      - openchamber-npm-cache:/home/openchamber/.npm
    environment:
      # Docker binds OpenChamber to 0.0.0.0 for port mapping, so UI auth is required.
      # Set this in Coolify's environment settings before starting, for example:
      #   OPENCHAMBER_UI_PASSWORD=<strong password>
      OPENCHAMBER_UI_PASSWORD: ${OPENCHAMBER_UI_PASSWORD:?Set OPENCHAMBER_UI_PASSWORD before exposing OpenChamber through Docker}
    # Optional environment variables (uncomment in Coolify's env settings):
    # OPENCHAMBER_HOST: 0.0.0.0            # Bind address (default in Docker entrypoint: 0.0.0.0)
    # OPENCHAMBER_CHATS_DIR: /path/to/chats  # Override folder that holds chats without a project
    # OPENCHAMBER_DATA_DIR: /path/to/data    # Override base data directory
    # OPENCHAMBER_TUNNEL_PROVIDER: cloudflare
    # OPENCHAMBER_TUNNEL_MODE: quick       # quick | managed-remote | managed-local
    # OPENCHAMBER_TUNNEL_HOSTNAME: app.example.com  # required for managed-remote
    # OPENCHAMBER_TUNNEL_TOKEN: your_cloudflare_token  # required for managed-remote
    # OPENCHAMBER_TUNNEL_CONFIG: /home/openchamber/.cloudflared/config.yml  # optional for managed-local
    # OH_MY_OPENCODE: true                 # enable oh-my-opencode
    # OPENCODE_HOST: http://172.17.0.1:4096 # Connect to external OpenCode server
    # OPENCODE_SKIP_START: true            # skip start opencode
    # OPENCHAMBER_OPENCODE_HOSTNAME: 0.0.0.0 # Bind OpenCode to all interfaces
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  openchamber-config:
  openchamber-opencode-share:
  openchamber-opencode-state:
  openchamber-opencode-config:
  openchamber-ssh:
  openchamber-workspaces:
  openchamber-opencode-cache:
  openchamber-npm-cache:
